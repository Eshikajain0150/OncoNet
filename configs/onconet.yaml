# OncoNet — configuration reproducing the settings reported in the manuscript
# (Sections 3.1, 3.3.4, 3.3.5; Tables 6 and 7). Every script reads this file.

seed: 42

paths:
  raw_dir: data/raw              # extracted Kaggle archive (any sub-folder layout)
  processed_dir: data/processed  # resized images, masks, ROIs, manifest
  output_dir: outputs            # checkpoints, logs, metrics, figures

dataset:
  # Source: "Blood Cell Images for Cancer Detection" (Kaggle, sumithsingh) [ref. 58].
  # The archive contains five cell-type folders. The manuscript uses a three-class,
  # task-specific subset; the folder -> class grouping is stated explicitly here.
  class_names: [AML, ALL, Healthy]
  mapping:
    AML: [myeloblast]
    ALL: [erythroblast]
    Healthy: [basophil, monocyte, seg_neutrophil]
  # Images drawn per class (Section 3.1.1): 200 AML, 175 ALL, 125 Healthy = 500.
  # A class built from several folders is filled as evenly as possible across them.
  counts: {AML: 200, ALL: 175, Healthy: 125}
  image_extensions: [.jpg, .jpeg, .png, .bmp, .tif, .tiff]
  split: {train: 0.70, val: 0.15, test: 0.15}   # stratified, image level
  cv_folds: 5                                    # on the 425-image development pool

preprocess:
  seg_size: 256           # segmentation input (256x256 RGB)
  reinhard: true          # Reinhard colour normalisation, training-image reference
  local_size: 128         # multi-resolution regions: 128x128 (local) ...
  global_size: 256        # ... and 256x256 (global)
  vit_size: 224           # both resized to 224x224 for the transformer
  roi_mask_dilation: 3    # px dilation of the predicted cell mask before ROI masking

augmentation:             # training partition only
  rotation_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5
  rrc_scale: [0.85, 1.00]
  brightness: 0.15
  contrast: 0.15
  noise_std_max: 0.02
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_p: 0.25
  cutmix_p: 0.25

segmentation:
  channels: [32, 64, 128, 256, 512]
  loss_dice_weight: 0.5
  loss_bce_weight: 0.5
  optimizer: adam
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-5
  batch_size: 8
  max_epochs: 50
  plateau_factor: 0.5
  plateau_patience: 4
  min_lr: 1.0e-6
  early_stop_patience: 10
  threshold: 0.5

deit:
  backbone: deit_small_patch16_224.fb_in1k   # ImageNet-1K pretrained DeiT-Small/16
  pretrained: true
  lr: 3.0e-5
  weight_decay: 0.05
  betas: [0.9, 0.999]
  batch_size: 8
  max_epochs: 50
  warmup_epochs: 5
  min_lr: 1.0e-6
  grad_clip: 1.0
  supcon_weight: 0.1
  supcon_temperature: 0.07
  proj_dim: 128
  early_stop_patience: 8
  train_embedding_views: 4   # augmented views per training image for the AE-MLP stage

aemlp:
  hidden: [512, 256, 128]
  dropout: 0.40
  lr: 1.0e-4
  weight_decay: 1.0e-4
  batch_size: 16
  max_epochs: 50
  plateau_factor: 0.5
  plateau_patience: 3
  early_stop_patience: 8

error_guided:
  iterations: 3            # feedback-loop iterations (Table 15)
  oof_folds: 5             # out-of-fold hard-example mining inside the training partition
  margin: 0.20             # p(true) - max p(other) below this => hard example
  hard_weight: 3.0         # sample weight of hard examples during fine-tuning
  epochs: 10
  lr: 5.0e-5

baselines:
  resnet50:
    lr: 1.0e-4
    weight_decay: 1.0e-4
    batch_size: 16
    max_epochs: 50
    early_stop_patience: 8
    plateau_factor: 0.5
    plateau_patience: 3
  vit_small:
    backbone: vit_small_patch16_224.augreg_in1k
    lr: 3.0e-5
    weight_decay: 0.05
    batch_size: 8
    max_epochs: 50
    warmup_epochs: 5
    min_lr: 1.0e-6
    grad_clip: 1.0
    early_stop_patience: 8

robustness:
  low_stain_od_scale: 0.6
  high_stain_od_scale: 1.4
  low_resolution_factor: 4
  high_noise_std: 0.08

benchmark:
  warmup: 10
  repetitions: 100
  cpu_repetitions: 20
  throughput_batch: 16

runtime:
  num_workers: 0           # 0 is the safe choice on Windows
  deterministic: true
